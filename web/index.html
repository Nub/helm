<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1417" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Helm" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Helm</title>
    <script>
      // If the app's bundle fails to load (a page from an older build naming a file that is gone), reload once to
      // fetch the current page. At most one reload a minute, so a bundle that is really broken cannot loop.
      addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || !/\/assets\//.test(t.src)) return;
        try {
          var last = Number(sessionStorage.getItem('helm-reloaded') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('helm-reloaded', String(Date.now()));
        } catch (_) {
          return;
        }
        location.reload();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
